<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INAIA — Art that inspires</title>

  <!-- Brand font: Larken (Adobe Fonts). Make sure your domain is added to the kit. -->
  <link rel="stylesheet" href="https://use.typekit.net/kki5hgi.css">
  <!-- Fallback serif while Larken loads / when opened locally -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&display=swap">

  <link rel="icon" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-intro">

  <!-- ============ Intro: plates change inside the INAIA pattern ============ -->
  <section class="intro" id="intro" aria-label="Our collections">
    <div class="intro-row" id="introRow">
      <div class="intro-slot slot-cup" data-type="cup"><div class="icon-item"></div><p class="intro-name"></p></div>
      <div class="intro-slot slot-plate" data-type="plate"><div class="icon-item"></div><p class="intro-name"></p></div>
      <div class="intro-slot slot-vase" data-type="vase"><div class="icon-item"></div><p class="intro-name"></p></div>
    </div>
    <button class="intro-skip" id="introSkip" type="button">skip</button>
  </section>

  <!-- ============ Home: moving canvas of plates ============ -->
  <div class="stage" id="stage">
    <div class="canvas" id="canvas"></div>
  </div>

  <header class="topbar">
    <button class="btn menu-btn" type="button" aria-label="Menu">
      <span class="seg">
        <svg class="icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 6.5h14M2 11.5h14"/></svg>
        <span class="label">menu</span>
      </span>
    </button>

    <div class="brand">
      <img class="logo" src="assets/logo.svg" alt="INAIA">
      <p class="tagline">Art that inspires</p>
    </div>

    <button class="btn filter-btn" type="button" aria-label="Filter">
      <span class="seg">
        <svg class="icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 5h8M13 5h3M2 13h3M8 13h8M10 2.5v5M8 10.5v5"/></svg>
      </span>
      <span class="seg label">filter</span>
    </button>
  </header>

  <button class="experience" id="experience" type="button" aria-pressed="false">
    <span class="seg">
      <svg class="ring" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="3.5" r="1.5"/><circle cx="18" cy="6" r="1.5"/><circle cx="20.5" cy="12" r="1.5"/><circle cx="18" cy="18" r="1.5"/><circle cx="12" cy="20.5" r="1.5"/><circle cx="6" cy="18" r="1.5"/><circle cx="3.5" cy="12" r="1.5"/><circle cx="6" cy="6" r="1.2" opacity=".5"/><circle cx="12" cy="12" r="1.3"/></svg>
    </span>
    <span class="seg">experience view</span>
  </button>

  <!-- ============ Product panel ============ -->
  <section class="product" id="product" role="dialog" aria-modal="true" aria-labelledby="pTitle" aria-hidden="true">
    <div class="p-inner">
      <img class="logo" src="assets/logo.svg" alt="INAIA">
      <h2 class="p-title" id="pTitle"></h2>
      <div class="p-body">
        <div class="p-thumbs" id="pThumbs" role="tablist" aria-label="Product photos"></div>
        <div class="p-hero"><div class="p-view" id="pView"></div></div>
      </div>
      <div class="p-foot">
        <p class="p-size" id="pSize"></p>
        <button class="btn" id="seeCollection" type="button">
          <span class="seg">see collection</span>
          <span class="seg"><svg class="icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 9h12M11 5l4 4-4 4"/></svg></span>
        </button>
      </div>
    </div>
  </section>
  <button class="p-close" id="pClose" type="button" aria-label="Close product" tabindex="-1">
    <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4l14 14M18 4L4 18"/></svg>
  </button>

  <!-- ============ Collection page ============ -->
  <section class="collection" id="collection" role="dialog" aria-modal="true" aria-labelledby="cTitle" aria-hidden="true">
    <div class="c-scene">
      <img class="logo" src="assets/logo.svg" alt="INAIA">
      <div class="scene-art" id="cScene"></div>
    </div>

    <div class="c-info">
      <h2 class="c-title" id="cTitle"></h2>
      <p class="c-tag" id="cTag"></p>
      <p class="c-desc" id="cDesc"></p>
      <div class="c-specs">
        <h3>Specifications</h3>
        <dl id="cSpecs"></dl>
      </div>
    </div>

    <div class="c-side">
      <button class="c-back" id="cBack" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M21 12H3M8 7l-5 5 5 5"/></svg>back
      </button>
      <div class="c-detail" id="cDetail"></div>
    </div>
  </section>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
